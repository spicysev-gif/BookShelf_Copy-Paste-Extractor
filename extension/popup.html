<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           width: 280px; padding: 12px; margin: 0; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
    label { font-weight: 600; font-size: 12px; }
    select, input[type="text"] {
      flex: 1; padding: 4px 6px; font: inherit;
      border: 1px solid #ccc; border-radius: 4px;
    }
    button {
      width: 100%; padding: 8px; font-weight: 600; font-size: 13px;
      border: 0; border-radius: 4px; background: #2563eb; color: white; cursor: pointer;
    }
    button:disabled { background: #888; cursor: wait; }
    .status { margin-top: 8px; min-height: 1.4em; font-size: 12px; color: #444; }
    .status.error { color: #b00020; }
    .small { font-size: 11px; color: #666; margin-top: 8px; }
    .small a { color: inherit; }
    @media (prefers-color-scheme: dark) {
      body { background: #1c1c1e; color: #eee; }
      select, input[type="text"] { background: #2c2c2e; color: #eee; border-color: #444; }
      .status, .small { color: #bbb; }
    }
  </style>
</head>
<body>
  <h1>Bookshelf Extractor</h1>
  <div class="row">
    <label>Output</label>
    <select id="format"><option value="pdf">PDF</option><option value="txt">Text</option></select>
  </div>
  <div class="row">
    <label>Mode</label>
    <select id="mode">
      <option value="single">Single section</option>
      <option value="split">Split (ZIP)</option>
    </select>
  </div>
  <div class="row">
    <label>Backend</label>
    <input id="backend" type="text" placeholder="http://localhost:8000" />
  </div>
  <button id="extract">Extract this page</button>
  <div id="status" class="status"></div>
  <p class="small">Open a Bookshelf chapter, then click Extract. Backend URL is saved per-browser.</p>
  <script src="popup.js"></script>
</body>
</html>
